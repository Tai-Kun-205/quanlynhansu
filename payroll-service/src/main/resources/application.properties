spring.application.name=payroll-service

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/hr_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=ThisIsAVerySecretKeyForHRManagementSystemJWT2024ThisIsAVerySecretKeyForHRManagementSystemJWT2024
app.jwt.expiration=86400000

# Server
server.port=8084

# CORS
spring.mvc.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# Khoa xac thuc giua cac service (header X-Service-Key). Dat bien moi truong SERVICE_API_KEY; de trong = tu choi moi loi goi noi bo.
app.service-key=${SERVICE_API_KEY:}

# Dich vu phu thuoc (cau hinh qua bien moi truong, co gia tri mac dinh cho may local)
services.hr-core.soap-url=${HR_CORE_SOAP_URL:http://localhost:8082/ws}
services.hr-core.connect-timeout-ms=3000
services.hr-core.read-timeout-ms=5000
services.attendance.url=${ATTENDANCE_SERVICE_URL:http://localhost:8083}
services.attendance.connect-timeout-ms=3000
services.attendance.read-timeout-ms=5000
